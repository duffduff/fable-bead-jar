<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bead Jar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bead Jar</h1>
  <p class="subtitle">Do good things, earn beads, fill the jar.</p>

  <div class="jar"></div>

  <div class="controls">
    <button id="remove-bead">&minus; Remove</button>
    <span id="counter">0 / 20</span>
    <button id="add-bead">+ Add bead</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
