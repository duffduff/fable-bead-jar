<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bead Jar</title>
  <meta name="theme-color" content="#f5f0e8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bead Jar</h1>

  <!-- Shown once, before there's a jar to show. -->
  <section id="setup" class="panel" hidden>
    <h2>Whose jar is this?</h2>
    <p class="hint" id="setup-note"></p>
    <form id="setup-form">
      <input id="setup-name" placeholder="e.g. Ella" maxlength="30" autocomplete="off">
      <div id="setup-colors"></div>
      <div class="form-buttons">
        <button type="submit">Start the jar</button>
      </div>
    </form>
  </section>

  <main id="app" hidden>
    <p class="subtitle" id="jar-owner"></p>

    <div class="jar-zone">
      <div class="jar"></div>
      <p id="progress">0 beads to spend</p>
      <p id="totals"></p>
    </div>

    <p class="notice" id="price-notice" hidden>
      Your rewards have prices now, not targets — worth checking them.
      <button type="button" id="dismiss-notice">OK</button>
    </p>

    <section class="panel">
      <h2>Rewards</h2>
      <ul id="reward-list"></ul>
      <button id="new-reward">+ Add a reward</button>

      <form id="reward-form" hidden>
        <input id="reward-name" placeholder="e.g. Trip to the zoo"
               maxlength="60" autocomplete="off">
        <input id="reward-price" type="number" min="1" max="9999"
               placeholder="beads to buy it">
        <div class="form-buttons">
          <button type="submit">Create</button>
          <button type="button" id="cancel-reward">Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Add beads for&hellip;</h2>

      <div id="behavior-chips"></div>

      <label class="custom-amount">
        <input type="checkbox" id="custom-toggle">
        <span>Give a different amount:</span>
        <button type="button" id="count-minus" title="Fewer beads">&minus;</button>
        <span id="count-display">1</span>
        <button type="button" id="count-plus" title="More beads">+</button>
      </label>

      <button id="new-behavior">+ Add a reason</button>

      <form id="behavior-form" hidden>
        <p class="form-label">Pick a common reason, or type your own:</p>
        <div id="suggestions"></div>
        <input id="behavior-name" placeholder="e.g. Homework done"
               maxlength="40" autocomplete="off">
        <p class="form-label">Worth how many beads?</p>
        <input id="behavior-value" type="number" min="1" max="99" value="1">
        <div id="color-choices"></div>
        <div class="form-buttons">
          <button type="submit">Create</button>
          <button type="button" id="cancel-behavior">Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>History</h2>
      <ol id="log"></ol>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
