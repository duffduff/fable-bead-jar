<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bead Jar</title>
  <meta name="theme-color" content="#f5f0e8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bead Jar</h1>
  <p class="subtitle">Do good things, earn beads, fill the jar.</p>

  <div class="jar-zone">
    <div class="jar"></div>
    <p id="progress">0 beads</p>
    <p id="next-reward"></p>
  </div>

  <section class="panel">
    <h2>Rewards</h2>
    <ul id="reward-list"></ul>
    <button id="new-reward">+ Add a reward</button>

    <form id="reward-form" hidden>
      <input id="reward-name" placeholder="e.g. Trip to the zoo"
             maxlength="60" autocomplete="off">
      <input id="reward-target" type="number" min="1" max="9999"
             placeholder="beads needed">
      <p class="form-error" id="reward-error" hidden></p>
      <div class="form-buttons">
        <button type="submit">Create</button>
        <button type="button" id="cancel-reward">Cancel</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Add beads for&hellip;</h2>

    <div class="count-picker">
      <span>Beads to give:</span>
      <button id="count-minus" title="Fewer beads">&minus;</button>
      <span id="count-display">1</span>
      <button id="count-plus" title="More beads">+</button>
    </div>

    <div id="behavior-chips"></div>
    <button id="new-behavior">+ Add a reason</button>

    <form id="behavior-form" hidden>
      <p class="form-label">Pick a common reason, or type your own:</p>
      <div id="suggestions"></div>
      <input id="behavior-name" placeholder="e.g. Homework done"
             maxlength="40" autocomplete="off">
      <div id="color-choices"></div>
      <div class="form-buttons">
        <button type="submit">Create</button>
        <button type="button" id="cancel-behavior">Cancel</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>History</h2>
    <ol id="log"></ol>
  </section>

  <script src="app.js"></script>
</body>
</html>
